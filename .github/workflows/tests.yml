name: Static checks

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      - name: Check required static files
        shell: bash
        run: |
          test -f index.html
          test -f styles/main.css
          test -f scripts/main.js
          test -f images/hero.jpg
          test -f images/about.jpg
          test -f images/contact.jpg
